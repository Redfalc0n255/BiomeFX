; Hardware bring-up test for BiomeFX.
; Open this folder (firmware/bringup) in VS Code with the PlatformIO extension,
; then Upload and open the Serial Monitor.

[env:esp32doit]
platform = espressif32
board = esp32doit-devkit-v1          ; 30-pin ESP32 DevKit V1 (ESP-WROOM-32)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    zinggjm/GxEPD2@^1.6.0
